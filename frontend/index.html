<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#002B50" />
    <meta name="description" content="RJK Realty — Property Management, Simplified." />
    <title>RJK Realty · Property Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/brand/rjk-logo.png" />
    <style>
      /* Branded boot screen — visible before the JS bundle executes */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px; background: #ffffff;
        font-family: Inter, system-ui, sans-serif; transition: opacity .35s ease, visibility .35s ease;
      }
      html.dark #boot-splash { background: #07111d; }
      #boot-splash img { width: 220px; height: auto; }
      #boot-splash .logo-dark { display: none; }
      html.dark #boot-splash .logo-light { display: none; }
      html.dark #boot-splash .logo-dark { display: block; }
      #boot-splash .track { position: relative; width: 168px; height: 3px; border-radius: 99px; overflow: hidden; background: rgba(245,169,0,.18); }
      #boot-splash .track::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 99px;
        background: linear-gradient(90deg, transparent, #F5A900, transparent); animation: boot-sweep 1.25s cubic-bezier(.45,0,.25,1) infinite; }
      #boot-splash p { margin: -12px 0 0; font-size: 13px; color: #64748B; letter-spacing: .01em; }
      #boot-splash.is-hidden { opacity: 0; visibility: hidden; }
      @keyframes boot-sweep { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    </style>
    <script>
      try { if (localStorage.getItem('rjk-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <img class="logo-light" src="/brand/rjk-logo.png" alt="RJK Realty" />
      <img class="logo-dark" src="/brand/rjk-logo-light.png" alt="RJK Realty" />
      <div class="track"></div>
      <p>Preparing your property management workspace…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
